<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Test Water Grow Viewer</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
  <style>
    body { margin: 0; background: #0f172a; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; font-family: sans-serif; }
    model-viewer { width: 80vw; height: 80vh; }
  </style>
</head>
<body>
  <h2>Water Growth Test (Armature Bone Progression)</h2>
  <model-viewer src="test_water_grow.glb" autoplay animation-name="Water_Grow_Action" camera-controls exposure="1.2" shadow-intensity="1"></model-viewer>
</body>
</html>
