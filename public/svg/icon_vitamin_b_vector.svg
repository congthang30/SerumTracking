<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-labelledby="title description">
  <title id="title">Vitamin B drop icon</title>
  <desc id="description">Mint green water drop marked B, with a yellow circle near it, and peach and lilac circles to the right.</desc>
  <g stroke="#000000" stroke-linejoin="round" stroke-linecap="round">
    <!-- Drop, redrawn as an editable vector silhouette -->
    <path fill="#9DE3D1" stroke-width="3.4" d="
      M 41.3 10.4
      C 45.7 10.4 48.7 13.9 51.1 18.2
      L 71.5 52.9
      C 68.0 56.0 66.5 59.8 66.9 64.9
      C 67.5 73.1 73.9 79.5 81.2 79.7
      C 80.3 94.2 73.1 106.2 61.8 112.9
      C 48.5 121 32.4 119.8 20.6 113.1
      C 9.8 106.7 2.3 94.0 2.3 81.1
      C 2.3 70.0 6.2 60.8 12.3 50.4
      L 21.2 35.3
      C 22.0 33.9 23.6 32.9 24.5 29.4
      L 28.6 22.1
      C 32.5 14.7 35.7 10.4 41.3 10.4 Z"/>
    <!-- Small silhouette notches on the left of the drop -->
    <path fill="#000000" stroke="none" d="M 19.0 32.3 C 22.0 30.7 23.2 33.9 22.5 36.1 C 21.8 38.1 19.3 38.1 17.9 36.8 Z"/>
    <path fill="#000000" stroke="none" d="M 16.9 39.1 C 19.7 38.7 21.1 41.4 19.8 43.6 C 18.6 45.1 16.7 44.5 15.6 43.2 Z"/>
    <!-- B letter is a true vector path: no font dependency -->
    <path fill="#000000" stroke="none" fill-rule="evenodd" d="
      M 35.4 55.0
      L 43.8 55.0
      C 50.1 55.0 52.9 59.7 52.9 64.5
      C 52.9 67.3 51.8 69.7 49.9 71.2
      C 53.1 73.1 54.8 76.0 54.8 79.5
      C 54.8 85.4 51.0 89.1 44.7 89.1
      L 35.2 89.1
      C 33.7 89.1 32.9 88.1 32.9 86.8
      L 32.9 57.2
      C 32.9 55.8 33.7 55.0 35.4 55.0 Z
      M 37.1 59.8 L 37.1 69.1 L 43.0 69.1
      C 46.4 69.1 48.4 67.1 48.4 64.4
      C 48.4 61.6 46.5 59.8 43.0 59.8 Z
      M 37.1 73.0 L 37.1 84.8 L 44.1 84.8
      C 48.7 84.8 50.5 82.7 50.5 79.0
      C 50.5 75.2 48.4 73.0 44.1 73.0 Z"/>
    <!-- Color spots -->
    <circle cx="83.2" cy="64" r="12.4" fill="#FFEE80" stroke-width="3.1"/>
    <circle cx="112.3" cy="32.1" r="11.8" fill="#FFAD95" stroke-width="2.8"/>
    <circle cx="112.3" cy="96.1" r="11.8" fill="#B5B4EE" stroke-width="2.8"/>
  </g>
</svg>
